<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mergington High School Activities</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Mergington High School</h1>
      <h2>Extracurricular Activities</h2>
      <button type="button" id="teacher-auth-button" class="teacher-auth-button">Teacher login</button>
    </header>

    <main>
      <section id="activities-container">
        <h3>Available Activities</h3>
        <div id="activities-list">
          <!-- Activities will be loaded here -->
          <p>Loading activities...</p>
        </div>
      </section>

      <section id="signup-container">
        <h3>Sign Up for an Activity</h3>
        <p id="teacher-signin-prompt">Teacher sign-in is required to manage registrations.</p>
        <form id="signup-form" class="hidden">
          <div class="form-group">
            <label for="email">Student Email:</label>
            <input type="email" id="email" required placeholder="your-email@mergington.edu" />
          </div>
          <div class="form-group">
            <label for="activity">Select Activity:</label>
            <select id="activity" required>
              <option value="">-- Select an activity --</option>
              <!-- Activity options will be loaded here -->
            </select>
          </div>
          <button type="submit">Sign Up</button>
        </form>
        <div id="message" class="hidden"></div>
      </section>
    </main>

    <div id="teacher-login-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="teacher-login-title">
      <form id="teacher-login-form" class="modal-content">
        <button type="button" id="close-login-modal" class="modal-close" aria-label="Close">&times;</button>
        <h3 id="teacher-login-title">Teacher login</h3>
        <div class="form-group">
          <label for="teacher-username">Username</label>
          <input type="text" id="teacher-username" autocomplete="username" required />
        </div>
        <div class="form-group">
          <label for="teacher-password">Password</label>
          <input type="password" id="teacher-password" autocomplete="current-password" required />
        </div>
        <button type="submit">Log in</button>
        <p id="teacher-login-error" class="error hidden" role="alert"></p>
      </form>
    </div>

    <footer>
      <p>&copy; 2026 Mergington High School</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
